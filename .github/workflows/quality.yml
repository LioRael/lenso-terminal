name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: nightly-2026-07-10
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check generated contracts
        run: |
          cargo install --locked --version '=0.7.3' lenso-contract-codegen
          ./scripts/check-contracts.sh
      - name: Check every target
        run: cargo check --locked --workspace --all-targets
      - name: Test the workspace
        run: cargo test --locked --workspace --all-targets
      - name: Lint every target
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Check package payloads
        run: ./scripts/check-package-readiness.sh
