[workspace]
resolver = "2"
members = [
    "crates/lenso-capability-terminal-command-provider",
    "crates/lenso-capability-terminal-command",
    "crates/lenso-terminal-command-plugin",
    "crates/lenso-terminal-cli-plugin",
    "crates/lenso-terminal-cli-surface",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = true
repository = "https://github.com/LioRael/lenso-terminal"
rust-version = "1.94"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive", "string"] }
futures = "0.3"
lenso = { version = "0.5.5" }
lenso-capability-terminal-command = { version = "0.1.1", path = "crates/lenso-capability-terminal-command" }
lenso-capability-terminal-command-provider = { version = "0.1.1", path = "crates/lenso-capability-terminal-command-provider" }
lenso-contract-authoring = { version = "0.1.1" }
lenso-contract-codegen = { version = "0.7.3" }
lenso-contract-runtime = { version = "0.2.0" }
lenso-guest-sdk = { version = "0.3.0" }
lenso-kernel = { version = "0.3.3" }
lenso-plugin-authoring = { version = "0.2.0" }
lenso-runtime-codec = { version = "0.3.1" }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
single_match_else = "allow"
