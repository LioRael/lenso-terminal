[workspace]
resolver = "2"
members = [
    "crates/lenso-capability-terminal-command-provider",
    "crates/lenso-capability-terminal-command",
    "crates/lenso-terminal-command-plugin",
    "crates/lenso-terminal-cli-plugin",
    "crates/lenso-terminal-cli-surface",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = true
repository = "https://github.com/LioRael/lenso-terminal"
rust-version = "1.94"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive", "string"] }
futures = "0.3"
lenso = { version = "0.5.0", git = "https://github.com/LioRael/lenso-runtime-rust", rev = "89815107385475c8b5be378bdcf5e21aa74e02f0" }
lenso-capability-terminal-command = { version = "0.1.0", path = "crates/lenso-capability-terminal-command" }
lenso-capability-terminal-command-provider = { version = "0.1.0", path = "crates/lenso-capability-terminal-command-provider" }
lenso-contract-authoring = { version = "0.1.1", git = "https://github.com/LioRael/lenso-protocols", rev = "9d2774c767fd64a6cc63a5ac04360e9cb92816da" }
lenso-contract-codegen = { version = "0.6.4", git = "https://github.com/LioRael/lenso-protocols", rev = "9d2774c767fd64a6cc63a5ac04360e9cb92816da" }
lenso-contract-runtime = { version = "0.1.3", git = "https://github.com/LioRael/lenso-protocols", rev = "9d2774c767fd64a6cc63a5ac04360e9cb92816da" }
lenso-guest-sdk = { version = "0.2.0", git = "https://github.com/LioRael/lenso-runtime-rust", rev = "89815107385475c8b5be378bdcf5e21aa74e02f0" }
lenso-kernel = { version = "0.2.0", git = "https://github.com/LioRael/lenso", rev = "8599db7e4a214ed92f32089f81d14c833d4becf6" }
lenso-plugin-authoring = { version = "0.1.1", git = "https://github.com/LioRael/lenso-protocols", rev = "9d2774c767fd64a6cc63a5ac04360e9cb92816da" }
lenso-runtime-codec = { version = "0.2.0", git = "https://github.com/LioRael/lenso-runtime-rust", rev = "89815107385475c8b5be378bdcf5e21aa74e02f0" }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
single_match_else = "allow"
